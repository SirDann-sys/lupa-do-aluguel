[project]
name = "lupa-do-aluguel"
version = "2.0.0"
description = "Aponta cláusulas abusivas em contratos de aluguel residencial à luz da Lei do Inquilinato."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "avaliacao"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # texto em português usa "–", "º" e afins de propósito
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "S105", "S106"]
"avaliacao/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["backend/app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
