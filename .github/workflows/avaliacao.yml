# Avaliação real com os provedores de IA, toda segunda e sob demanda.
# Os números vão para o site como saírem, inclusive quando pioram.
name: Avaliação

on:
  schedule:
    - cron: "0 9 * * 1"   # segunda, 6h de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avaliacao
  cancel-in-progress: false

jobs:
  avaliar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LUPA_GROQ_API_KEY: ${{ secrets.LUPA_GROQ_API_KEY }}
      LUPA_GEMINI_API_KEY: ${{ secrets.LUPA_GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Linha de base (heurística)
        run: python avaliacao/rodar.py --provedor heuristico --saida avaliacao/resultados-publicos/heuristico.json
      - name: Groq
        if: env.LUPA_GROQ_API_KEY != ''
        # pausa entre contratos para caber no limite de tokens por minuto do plano grátis
        run: python avaliacao/rodar.py --provedor groq --pausa 20 --saida avaliacao/resultados-publicos/groq.json
      - name: Gemini
        if: env.LUPA_GEMINI_API_KEY != ''
        continue-on-error: true
        run: python avaliacao/rodar.py --provedor gemini --pausa 10 --saida avaliacao/resultados-publicos/gemini.json
      - name: Grava os resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avaliacao/resultados-publicos
          git diff --cached --quiet || git commit -m "avaliação: resultados de $(date -u +%F) [skip ci]"
          git push

  publicar:
    needs: avaliar
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
