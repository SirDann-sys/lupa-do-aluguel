name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lupa
          POSTGRES_PASSWORD: lupa
          POSTGRES_DB: lupa_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lupa" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Testes (SQLite) com cobertura
        run: pytest --cov --cov-report=term
      - name: Testes de banco e migrações (PostgreSQL)
        env:
          LUPA_TESTE_DATABASE_URL: postgresql://lupa:lupa@localhost:5432/lupa_teste
        run: pytest backend/tests/test_banco.py -q
      - name: Avaliação offline (extrator heurístico, sem rede)
        run: python avaliacao/rodar.py --provedor heuristico

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t lupa-do-aluguel .
      - name: Sobe o container e testa de fora
        run: |
          docker run -d --name api -p 8000:8000 lupa-do-aluguel
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep -q '"heuristico"'
          curl -sf -X POST localhost:8000/v1/analises -H 'Content-Type: application/json' \
            --data "$(python3 -c 'import json; print(json.dumps({"texto": open("avaliacao/contratos/02_abusivo_full.txt", encoding="utf-8").read()}))')" \
            | python3 -c 'import json, sys; r = json.load(sys.stdin); regras = sorted({a["regra"] for a in r["achados"]}); print(regras); assert regras == [1, 2, 3, 4, 5, 6, 7]'
          docker exec api id -u | grep -qv '^0$'   # não roda como root
      - if: failure()
        run: docker logs api
